base_url = "https://artofpeace.raskell.io"
title = "The Art of Peace"
description = "On living together without thinking alike. A short book by raskell about freedom, disagreement, and the practice of peace."
default_language = "en"
theme = "shore"
compile_sass = true
build_search_index = false
generate_feeds = false

[markdown]
smart_punctuation = true

[extra]
author = "raskell"
