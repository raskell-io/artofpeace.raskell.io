name: Check book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run check
      - name: Notify IndexNow
        if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        continue-on-error: true
        run: mise run indexnow
